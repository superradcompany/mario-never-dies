<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Checkpoints along a run</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="180" y="62" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">gate: no Jev request in flight</text>
<text x="330" y="62" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">150 frames later</text>
<text x="480" y="62" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">150 frames later</text>
<line x1="60" y1="110" x2="600" y2="110" stroke="#5DCAA5" stroke-width="3" stroke-linecap="round"/>
<circle cx="600" cy="110" r="6" fill="#5DCAA5"/>
<text x="60" y="134" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">stage start</text>
<text x="600" y="134" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">Mario keeps playing</text>
<rect x="174" y="100" width="4" height="20" fill="#AFA9EC"/>
<rect x="182" y="100" width="4" height="20" fill="#AFA9EC"/>
<path d="M180 122 L180 158" fill="none" stroke="#888780" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="120" y="160" width="120" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/>
<text x="180.0" y="178" fill="#CECBF6" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Frozen copy</text>
<text x="180.0" y="198" fill="#AFA9EC" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">whole VM, paused</text>
<rect x="324" y="100" width="4" height="20" fill="#AFA9EC"/>
<rect x="332" y="100" width="4" height="20" fill="#AFA9EC"/>
<path d="M330 122 L330 158" fill="none" stroke="#888780" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="270" y="160" width="120" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/>
<text x="330.0" y="178" fill="#CECBF6" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Frozen copy</text>
<text x="330.0" y="198" fill="#AFA9EC" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">whole VM, paused</text>
<rect x="474" y="100" width="4" height="20" fill="#AFA9EC"/>
<rect x="482" y="100" width="4" height="20" fill="#AFA9EC"/>
<path d="M480 122 L480 158" fill="none" stroke="#888780" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="420" y="160" width="120" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/>
<text x="480.0" y="178" fill="#CECBF6" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Frozen copy</text>
<text x="480.0" y="198" fill="#AFA9EC" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">whole VM, paused</text>
<text x="340" y="250" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">each drop is branch() in about 150 ms, then pause(); the copies wait as save slots</text>
</svg>
