# Publishes the Mario Never Dies guest image, ghcr.io/superradcompany/mnd.
#
# The image is dependencies only, built from image/Dockerfile. main publishes `latest`, which is
# what the launcher pulls (mnd/launcher.py); a tag mnd-v1.2.3 also publishes `1.2.3`. Any other
# branch that touches the image builds and checks it, and publishes nothing.
name: mnd image

on:
  push:
    branches: ["**"]
    paths:
      - image/**
      - .github/workflows/mnd-image.yml
    tags: ["mnd-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tags
        id: tags
        run: |
          {
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              echo "publish=true"
              echo "list=ghcr.io/superradcompany/mnd:latest"
              echo "check=ghcr.io/superradcompany/mnd:latest"
            elif [[ "$GITHUB_REF" == refs/tags/mnd-v* ]]; then
              echo "publish=true"
              echo "list=ghcr.io/superradcompany/mnd:${GITHUB_REF_NAME#mnd-v}"
              echo "check=ghcr.io/superradcompany/mnd:${GITHUB_REF_NAME#mnd-v}"
            else
              echo "publish=false"
              echo "list=mnd:check"
              echo "check=mnd:check"
            fi
          } >> "$GITHUB_OUTPUT"

      # Apple Silicon hosts run arm64 guests, Linux x86 hosts run amd64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Published builds are for both kinds of host. A branch only needs one to be checked, and
      # a single platform is what can be loaded into the runner to look inside.
      - uses: docker/build-push-action@v6
        with:
          context: image
          platforms: ${{ steps.tags.outputs.publish == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ steps.tags.outputs.publish == 'true' }}
          load: ${{ steps.tags.outputs.publish != 'true' }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Guest image for Mario Never Dies: dependencies only, no game data
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The emulator's package bundles Nintendo ROMs. The Dockerfile drops them before the
      # published stage; this proves no layer of the image carries one.
      - name: No game data in any layer
        run: |
          if [[ "${{ steps.tags.outputs.publish }}" == "true" ]]; then
            docker pull "${{ steps.tags.outputs.check }}"
          fi
          docker save "${{ steps.tags.outputs.check }}" -o image.tar
          layer_dir=$(mktemp -d)
          tar -xf image.tar -C "$layer_dir"
          found=0
          while IFS= read -r layer; do
            if tar -tf "$layer" 2>/dev/null | grep -i '\.nes$'; then found=1; fi
          done < <(find "$layer_dir" -type f \( -name '*.tar' -o -path '*/blobs/sha256/*' \))
          test "$found" -eq 0
